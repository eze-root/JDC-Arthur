name: Check Arthur integration
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 lua5.1
      - run: node --test tests/singbox.test.mjs
      - name: Validate real nft rules in a disposable network namespace
        run: sudo env TEST_REAL_NFT=1 unshare --net "$(command -v node)" --test --test-name-pattern="real Linux" tests/singbox.test.mjs
      - name: Lua syntax and required build selections
        run: |
          luac5.1 -p files/usr/lib/lua/luci/model/cbi/singbox.lua
          luac5.1 -p files/usr/lib/lua/luci/controller/singbox.lua
          sh scripts/check-arthur-config.sh configs/0-jd1800.config base
          mkdir -p .local/core-check/etc/config
          cp files/etc/config/singbox .local/core-check/etc/config/
          sh scripts/install-official-sing-box.sh .local/core-check
          sh scripts/check-arthur-config.sh configs/0-jd1800-tproxy.config singbox-ipv4 .local/core-check
          sh scripts/check-arthur-config.sh configs/0-jd1800-tproxy.config singbox-dualstack .local/core-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs .local/docs-html
